<!DOCTYPE html>
<html lang="en">
<head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Bill Divider_2</title>
        <script src="script.js" defer></script>
        <link rel="stylesheet" href="style.css">
</head>
<body>
        <div class="main-container">
                <div class="bill-calc-container">

                        <div class="bill-calc-row bill-input-container">
                                <label class="bill-calc-heading" for="bill-input">Bill Amount</label>
                                <div class="bill-input-wrapper">
                                        <span>₹</span>
                                        <input  type="number" id="bill-input">
                                </div>
                                
                        </div>

                        <div class="bill-calc-row tip-input-container">
                                <label class="bill-calc-heading" for="custom-tip-input">Select Tip</label>

                                <div class="tip-btns">

                                        <div class="tip-btn">
                                                <input disabled type="radio" id="tip-no" name="tip-rate" value="0">
                                                <label class="btn" for="tip-no">No Tip</label>
                                        </div>

                                        <div class="tip-btn">
                                                <input disabled type="radio" id="tip-5" name="tip-rate" value="5">
                                                <label class="btn" for="tip-5">5%</label>
                                        </div>

                                        <div class="tip-btn">
                                                <input disabled type="radio" id="tip-10" name="tip-rate" value="10">
                                                <label class="btn" for="tip-10">10%</label>
                                        </div>

                                        <div class="tip-btn">
                                                <input disabled type="radio" id="tip-15" name="tip-rate" value="15">
                                                <label class="btn" for="tip-15">15%</label>
                                        </div>
                                        
                                        <div class="tip-btn">
                                                <input disabled type="radio" id="tip-25" name="tip-rate" value="25">
                                                <label class="btn" for="tip-25">25%</label>
                                        </div>

                                        <div class="tip-btn">
                                                <input disabled type="radio" id="tip-50" name="tip-rate" value="50">
                                                <label class="btn" for="tip-50">50%</label>
                                        </div>
                                        
                                </div>

                                <input disabled type="number" id="custom-tip" placeholder="Custom tip in %">
                        </div>

                        <div class="bill-calc-row people-input-container">
                                <label class="bill-calc-heading"for="people-count">Number of People</label>
                                <input disabled type="number" id="people-count" placeholder="e.g. 3">
                        </div>
                        <button disabled type="button" class="btn bill-calc-btn">Generate Bill</button>
                </div>

                <div class="invoice-container">
                        <p class="invoice-name">Your Invoice </p>
                        <div class="invoice-inner-container">
                                <div class="invoice-heading">Bill Amount:</div>
                                <div class="amount pr-bill">---</div>
                                <div class="invoice-heading">Tip:</div>
                                <div class="amount pr-tip">---</div>
                                <div class="invoice-heading">Total Bill:</div>
                                <div class="amount pr-total-bill">---</div>
                                <div class="invoice-heading">Nos. of Person:</div>
                                <div class="amount pr-person-nos">---</div>
                                <div class="invoice-heading">Each Person Bill:</div>
                                <div class="amount pr-each-share">---</div>
                        </div>
                        
                        <button disabled type="button" class="btn bill-reset-btn">Reset</button>
                </div>
        </div>

       
</body>
</html>
